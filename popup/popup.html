<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>텍스트 자동 변환기</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <img src="../icons/icon32.png" alt="" width="28" height="28" />
      <div>
        <div class="brand-title">텍스트 자동 변환기</div>
        <div class="brand-sub" id="masterStatus">켜짐</div>
      </div>
    </div>
    <label class="switch switch-lg">
      <input type="checkbox" id="masterToggle" />
      <span class="slider"></span>
    </label>
  </header>

  <main id="app">
    <section class="panel" data-section="calc">
      <div class="panel-head">
        <span class="panel-title">CALC <em>수식 계산</em></span>
        <label class="switch"><input type="checkbox" id="calcToggle" /><span class="slider"></span></label>
      </div>
      <p class="panel-desc"><code>!수식!</code> 값 — 닫는 <code>!</code> 입력 시 계산됩니다. 예) <code>!12*3!</code> → <code>36</code></p>
    </section>

    <section class="panel" data-section="symbols">
      <div class="panel-head">
        <span class="panel-title">SYMBOLS <em>기호 변환</em></span>
        <label class="switch"><input type="checkbox" id="symbolsToggle" /><span class="slider"></span></label>
      </div>
      <div class="rule-list" id="symbolsList"></div>
    </section>

    <section class="panel" data-section="brackets">
      <div class="panel-head">
        <span class="panel-title">BRACKETS <em>괄호</em></span>
        <label class="switch"><input type="checkbox" id="bracketsToggle" /><span class="slider"></span></label>
      </div>
      <p class="panel-desc">단축키(트리거)는 직접 수정할 수 있습니다.</p>
      <div class="rule-list" id="bracketsList"></div>
    </section>

    <section class="panel" data-section="custom">
      <div class="panel-head">
        <span class="panel-title">CUSTOM <em>나의 변환 규칙</em></span>
        <label class="switch"><input type="checkbox" id="customToggle" /><span class="slider"></span></label>
      </div>
      <div class="custom-list" id="customList"></div>
    </section>
  </main>

  <footer class="app-footer">
    <span id="saveStatus" role="status"></span>
  </footer>

  <script src="../lib/defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
